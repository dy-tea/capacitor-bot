[package]
name = "capacitor-bot"
edition = "2024"

[[bin]]
name = "capacitor-bot"
path = "src/main.rs"

[dependencies]
rayon = "1.12"
anyhow = "1.0"
capacitor = { version = "0.2.0", git = "https://github.com/krypt0nn/capacitor" }
mimalloc = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rouille = "3.6"
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "http",
    "model",
    "builder",
    "cache",
    "collector",
    "rustls_backend"
] }
tokio = { version = "1.0", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "io-util",
    "time",
    "process"
] }
rand_chacha = "0.3"
